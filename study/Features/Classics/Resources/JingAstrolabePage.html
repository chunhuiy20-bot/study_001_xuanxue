<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>紫微斗数 · 本命盘</title>
    <style>
        :root {
            --c-bg: #050505;
            --c-gold: #e6d3a3;
            --c-gold-glow: rgba(230, 211, 163, 0.45);
            --c-red: #b73a3a;
            --c-red-glow: rgba(183, 58, 58, 0.45);
            --c-white: #e8e8e8;
            --c-gray: #8a8a8a;
            --c-border: rgba(230, 211, 163, 0.25);
            --c-gold-muted: rgba(230, 211, 163, 0.1);
            --font-serif: "STKaiti", "Kaiti SC", "Songti SC", serif;
            --font-mono: "Menlo", "Courier New", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--c-bg);
            color: var(--c-white);
            font-family: var(--font-serif);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        #starCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.95;
        }

        .sys-toast {
            position: fixed;
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: var(--c-gold);
            border: 1px solid var(--c-border);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.82rem;
            letter-spacing: 1px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 1200;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .sys-toast.show { opacity: 1; }

        .header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 14px 0 14px;
        }
        .header-left { display: flex; flex-direction: column; }

        .user-selector { position: relative; width: 124px; }
        .current-user {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--c-gold);
            font-size: 0.95rem;
            border-bottom: 1px solid var(--c-border);
            padding-bottom: 4px;
            cursor: pointer;
            letter-spacing: 2px;
            text-indent: 2px;
        }
        .current-user .arrow { font-size: 0.75rem; transition: transform 0.3s; text-indent: 0; }
        .user-selector.open .arrow { transform: rotate(180deg); }

        .user-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 190px;
            max-height: 0;
            overflow: hidden;
            background: rgba(6, 6, 6, 0.95);
            border: 1px solid transparent;
            border-radius: 6px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: max-height 0.35s ease, border-color 0.35s;
            z-index: 20;
        }
        .user-selector.open .user-dropdown {
            max-height: 280px;
            border-color: var(--c-border);
        }
        .u-item { padding: 12px 16px; font-size: 0.9rem; color: var(--c-white); cursor: pointer; transition: background 0.2s; font-family: var(--font-serif); }
        .u-item:active { background: var(--c-border); }
        .u-item.active { color: var(--c-gold); background: var(--c-gold-muted); }
        .u-divider { height: 1px; background: var(--c-border); margin: 4px 0; }
        .u-add { padding: 11px 16px; font-size: 0.85rem; color: var(--c-gray); cursor: pointer; letter-spacing: 1px; }
        .u-add:active { background: var(--c-border); color: var(--c-gold); }

        .date-sub {
            margin-top: 6px;
            color: var(--c-gray);
            font-size: 0.62rem;
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }

        .header-right {
            color: var(--c-gray);
            font-size: 0.72rem;
            letter-spacing: 1px;
            padding-top: 4px;
            font-family: var(--font-serif);
        }

        .astrolabe-container {
            position: relative;
            z-index: 5;
            width: 100%;
            height: calc(100vh - 182px);
            padding: 10px 12px 6px;
        }

        .grid-12 {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 6px;
        }

        .palace {
            position: relative;
            border: 1px solid var(--c-border);
            background: rgba(8, 8, 8, 0.56);
            border-radius: 4px;
            padding: 3px 4px 1px;
            overflow: hidden;
            transition: border-color 0.25s, background 0.25s;
        }
        .palace.active {
            border-color: var(--c-gold);
            box-shadow: 0 0 8px rgba(230, 211, 163, 0.2), inset 0 0 8px rgba(230, 211, 163, 0.1);
            background: rgba(20, 16, 10, 0.66);
        }
        .palace.trine { border-color: rgba(230, 211, 163, 0.55); }

        .p-major-stars { display: flex; flex-direction: column; gap: 1px; margin-bottom: 2px; min-height: 26px; }
        .star-col {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: var(--c-gold);
            font-size: 0.64rem;
            line-height: 1.05;
            letter-spacing: 1px;
        }
        .s-name { color: var(--c-gold); }
        .s-status { color: var(--c-gray); font-size: 0.5rem; transform: translateY(0.5px); }
        .s-sihua {
            font-size: 0.5rem;
            line-height: 1;
            padding: 0 2px;
            border-radius: 3px;
            border: 1px solid;
            transform: translateY(0.5px);
        }
        .s-gold { color: var(--c-gold); border-color: var(--c-gold); }
        .s-red { color: #de8f8f; border-color: #de8f8f; }

        .p-minor-stars {
            color: var(--c-gray);
            font-size: 0.52rem;
            line-height: 1.1;
            min-height: 22px;
            margin-bottom: 1px;
        }
        .minor-col { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .p-gods {
            display: flex;
            gap: 4px;
            color: #6f7278;
            font-size: 0.46rem;
            line-height: 1;
            margin-bottom: 2px;
            min-height: 8px;
        }

        .p-age {
            position: absolute;
            right: 3px;
            top: 2px;
            color: #8d8d8d;
            font-family: var(--font-mono);
            font-size: 0.5rem;
            opacity: 0.8;
        }

        .p-name-branch {
            position: absolute;
            left: 2px;
            bottom: 1px;
            width: calc(100% - 4px);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.53rem;
            letter-spacing: 0.5px;
        }
        .p-name { color: var(--c-white); }
        .p-branch { color: #86898f; font-family: var(--font-mono); font-size: 0.5rem; }

        .ming-gong { }

        .center-hub {
            grid-column: 2 / 4;
            grid-row: 2 / 4;
            border: 1px solid var(--c-border);
            border-radius: 6px;
            background: rgba(7, 7, 7, 0.72);
            padding: 6px 7px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(230, 211, 163, 0.05);
        }
        .center-hub::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(230,211,163,0.06), transparent 65%);
        }

        .hub-head {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 8px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            z-index: 2;
        }
        .hub-name { color: var(--c-gold); font-size: 0.82rem; }
        .hub-tag { color: #c99b9b; font-size: 0.62rem; }
        .hub-ju { color: var(--c-gray); font-size: 0.58rem; }

        .hub-info {
            color: var(--c-gray);
            font-size: 0.55rem;
            letter-spacing: 0.4px;
            z-index: 2;
        }

        .four-pillars {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
            margin: 2px 0;
            z-index: 2;
        }
        .pillar-col {
            border: 1px solid rgba(230, 211, 163, 0.2);
            border-radius: 4px;
            text-align: center;
            padding: 2px 0;
            background: rgba(255,255,255,0.02);
        }
        .p-label {
            display: block;
            color: #7c7f84;
            font-size: 0.42rem;
            margin-bottom: 1px;
        }
        .c-stem, .c-branch {
            display: inline-block;
            min-width: 11px;
            color: var(--c-gold);
            font-size: 0.62rem;
            line-height: 1;
        }

        .control-btns {
            display: flex;
            gap: 6px;
            z-index: 2;
        }
        .c-btn {
            font-size: 0.5rem;
            color: var(--c-gray);
            border: 1px solid rgba(230,211,163,0.18);
            border-radius: 10px;
            padding: 2px 7px;
        }
        .c-btn.active {
            color: var(--c-gold);
            border-color: var(--c-gold);
            background: rgba(230,211,163,0.1);
        }

        .timeline-section {
            position: relative;
            z-index: 10;
            padding: 4px 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .tl-row {
            display: grid;
            grid-template-columns: 36px 1fr;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }
        .tl-header {
            color: var(--c-gray);
            font-size: 0.58rem;
            letter-spacing: 1px;
            text-align: right;
        }

        .tl-content {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0 4px 2px;
            scroll-snap-type: x mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
        }
        .tl-content::-webkit-scrollbar { display: none; }

        .tl-cell {
            flex: 0 0 calc(22% - 8px);
            padding: 6px 0;
            border-radius: 4px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tl-cell.active { background: var(--c-gold); transform: scale(1.05); }

        .t-top { font-size: 11px; color: var(--c-white); font-family: var(--font-mono); }
        .t-bot { font-size: 10px; color: var(--c-gray); margin-top: 2px; font-family: var(--font-serif); }
        .tl-cell.active .t-top, .tl-cell.active .t-bot { color: var(--c-bg); font-weight: bold; }

        .bottom-nav { position: relative; z-index: 100; height: 60px; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; padding-bottom: 10px; border-top: 1px solid var(--c-border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--c-gray); cursor: pointer; width: 60px; transition: color 0.3s; }
        .nav-text { font-size: 0.75rem; font-family: var(--font-serif); font-weight: bold; letter-spacing: 2px; text-indent: 2px; }
        .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; transition: all 0.3s; }
        .nav-item.active { color: var(--c-gold); }
        .nav-item.active .nav-dot { background: var(--c-gold); box-shadow: 0 0 10px var(--c-gold-glow); }
    </style>
</head>

<script>
    function showToast(msg) {
        const t = document.getElementById('sysToast');
        t.innerText = msg;
        t.classList.add('show');
        if (navigator.vibrate) navigator.vibrate([10]);
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    const userSelector = document.getElementById('userSelector');
    document.addEventListener('click', (e) => {
        if (userSelector.contains(e.target)) userSelector.classList.toggle('open');
        else userSelector.classList.remove('open');
    });

    const btnAddNew = document.getElementById('btnAddNew');
    if (btnAddNew) {
        btnAddNew.addEventListener('click', () => showToast('请通过上层逻辑创建命盘'));
    }

    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, stars = [];
    let frame = 0;

    const ConstellationShapes = [
        [[0,0], [15,20]], [[0,0], [-20,10], [-10,-15]], [[0,0], [25,0], [12, 15], [12, -15]],
        [[0,0], [15,20], [30,40]], [[0,0], [20,10], [15,-15]], [[0,0], [10,15], [20,30], [25,45]],
        [[0,0], [20,-10], [35,-5]], [[0,0], [20,-10], [40,-5], [55,10], [55,30]],
        [[0,0], [15,20]], [[0,0], [-20,10], [-10,-15]], [[0,0], [25,0]],
        [[0,0], [15,20], [30,40]], [[0,0], [20,10], [15,-15]], [[0,0], [10,15], [20,30]]
    ];

    class Star {
        constructor(isCore = false, targetPos = null, groupIndex = 0) {
            this.x = targetPos ? targetPos.x : (width / 2 + (Math.random() - 0.5) * width * 2.5);
            this.y = targetPos ? targetPos.y : (height / 2 + (Math.random() - 0.5) * height * 2.5);
            this.isCore = isCore;
            this.groupIndex = groupIndex;
            this.size = isCore ? (Math.random() * 1.2 + 0.8) : (Math.random() * 1.0 + 0.1);
            this.baseOpacity = isCore ? (Math.random() * 0.4 + 0.4) : (Math.random() * 0.2 + 0.05);

            if (!isCore) {
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.twinklePhase = Math.random() * Math.PI * 2;
                this.isBlinker = Math.random() < 0.15;
            } else {
                this.speed = Math.random() * 0.02 + 0.01;
            }
            this.color = 'rgba(255, 255, 255, ';
        }

        draw(ctx) {
            let opacity = this.baseOpacity;
            if (this.isCore) {
                opacity += Math.sin(frame * this.speed) * 0.2;
            } else {
                if (this.isBlinker) {
                    let flash = Math.pow(Math.sin(frame * this.twinkleSpeed + this.twinklePhase), 8);
                    opacity += flash * 0.5;
                } else {
                    opacity += Math.sin(frame * this.twinkleSpeed + this.twinklePhase) * 0.05;
                }
            }
            opacity = Math.max(0.05, Math.min(1, opacity));

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color + opacity + ')';
            if (this.isCore || (this.isBlinker && opacity > 0.5)) {
                ctx.shadowBlur = 6;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.fill();
        }
    }

    function init() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        stars = [];
        for (let i = 0; i < 300; i++) stars.push(new Star());
        for (let i = 0; i < 14; i++) {
            const centerX = width / 2 + (Math.random() - 0.5) * width * 1.5;
            const centerY = height / 2 + (Math.random() - 0.5) * height * 1.5;
            const angle = Math.random() * Math.PI * 2;
            const scale = Math.random() * 2.0 + 1.2;
            ConstellationShapes[i].forEach(offset => {
                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);
                const rX = (offset[0] * cosA - offset[1] * sinA) * scale;
                const rY = (offset[0] * sinA + offset[1] * cosA) * scale;
                stars.push(new Star(true, { x: centerX + rX, y: centerY + rY }, i));
            });
        }
    }

    function drawConstellationLines(ctx) {
        ctx.lineWidth = 0.5;
        const groups = {};
        stars.filter(s => s.isCore).forEach(s => {
            if (!groups[s.groupIndex]) groups[s.groupIndex] = [];
            groups[s.groupIndex].push(s);
        });
        for (let g in groups) {
            const p = groups[g];
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.moveTo(p[0].x, p[0].y);
            for (let i = 1; i < p.length; i++) { ctx.lineTo(p[i].x, p[i].y); }
            ctx.stroke();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        frame++;
        ctx.save();
        ctx.translate(width / 2, height / 2);
        ctx.rotate(frame * 0.0003);
        ctx.translate(-width / 2, -height / 2);
        drawConstellationLines(ctx);
        stars.forEach(s => s.draw(ctx));
        ctx.restore();
        requestAnimationFrame(animate);
    }
    window.addEventListener('resize', init);
    init();
    animate();

    const palaces = document.querySelectorAll('.palace');
    const limitBtns = document.querySelectorAll('.limit-btn');

    function highlightPalace(idx) {
        palaces.forEach(el => { el.classList.remove('active'); el.classList.remove('trine'); });
        const target = document.querySelector(`.palace[data-idx="${idx}"]`);
        if (!target) return;
        target.classList.add('active');
        document.querySelector(`.palace[data-idx="${(idx + 6) % 12}"]`)?.classList.add('trine');
        document.querySelector(`.palace[data-idx="${(idx + 4) % 12}"]`)?.classList.add('trine');
        document.querySelector(`.palace[data-idx="${(idx + 8) % 12}"]`)?.classList.add('trine');
    }

    palaces.forEach(p => {
        p.addEventListener('click', function() {
            if (navigator.vibrate) navigator.vibrate(10);
            const idx = parseInt(this.getAttribute('data-idx'));
            highlightPalace(idx);

            const ageText = this.querySelector('.p-age').innerText;
            limitBtns.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-age') === ageText) {
                    btn.classList.add('active');
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            });
        });
    });

    limitBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            if (navigator.vibrate) navigator.vibrate(10);
            limitBtns.forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            this.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

            const targetAge = this.getAttribute('data-age');
            if (targetAge === '起限前') return;
            palaces.forEach(p => {
                if (p.querySelector('.p-age').innerText === targetAge) {
                    const idx = parseInt(p.getAttribute('data-idx'));
                    highlightPalace(idx);
                }
            });
        });
    });
</script>
</body>
</html>
